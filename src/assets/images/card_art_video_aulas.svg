<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aulasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240718" />
      <stop offset="45%" stop-color="#180410" />
      <stop offset="100%" stop-color="#0a0208" />
    </linearGradient>

    <!-- Pink Glow Filter -->
    <filter id="aulasGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Film Frame Pattern -->
    <pattern id="aulasGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.9" fill="#f43f5e" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Card Background with Rounded Border -->
  <rect x="1.5" y="1.5" width="597" height="147" rx="18" fill="url(#aulasBg)" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.55" />
  
  <!-- Subtle Texture -->
  <rect x="2" y="2" width="596" height="146" rx="17" fill="url(#aulasGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="80" cy="75" r="70" fill="#f43f5e" opacity="0.2" filter="url(#aulasGlow)" />
  <circle cx="560" cy="20" r="45" fill="#fb7185" opacity="0.12" filter="url(#aulasGlow)" />

  <!-- HUD Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.8" />
  <path d="M 588 24 L 588 12 L 576 12" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.8" />
  <path d="M 12 126 L 12 138 L 24 138" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.8" />
  <path d="M 588 126 L 588 138 L 576 138" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.8" />

  <!-- Icon Container -->
  <g transform="translate(24, 30)">
    <!-- Glow Box -->
    <rect x="0" y="0" width="88" height="88" rx="18" fill="#4c0519" fill-opacity="0.6" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.6" filter="url(#aulasGlow)" />
    <!-- Clapperboard / Film Frame Graphic -->
    <circle cx="44" cy="44" r="26" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
    <text x="44" y="55" font-size="34" text-anchor="middle">🎬</text>
    <!-- Pulse Ring -->
    <circle cx="78" cy="10" r="4" fill="#f43f5e" />
    <circle cx="78" cy="10" r="2" fill="#ffffff" />
  </g>

  <!-- Content Group -->
  <g transform="translate(130, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="82" height="19" rx="5" fill="#4c0519" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.6" />
      <text x="41" y="13.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#fecdd3" text-anchor="middle" letter-spacing="1">TUTORIAIS</text>

      <rect x="88" y="0" width="88" height="19" rx="5" fill="#2e1065" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
      <text x="132" y="13.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="0.5">PASSO A PASSO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="'Orbitron', system-ui, sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="1.2">
      VIDEO <tspan fill="#fb7185">AULAS</tspan>
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="103" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#fecdd3" letter-spacing="0.2">
      Treinamentos e aulas práticas passo a passo Nordy e RunningHub
    </text>

    <!-- Extra highlight tags -->
    <g transform="translate(0, 115)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f43f5e">
        🎬 COMFYUI • FISH AUDIO • CLONAGEM VOZ • WORKFLOWS AO VIVO
      </text>
    </g>
  </g>

  <!-- Action Button (Right Side) -->
  <g transform="translate(480, 52)">
    <rect x="0" y="0" width="96" height="42" rx="11" fill="#881337" fill-opacity="0.5" stroke="#fb7185" stroke-width="1.2" filter="url(#aulasGlow)" />
    <text x="40" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ASSISTIR</text>
    <!-- Arrow -->
    <path d="M 74 21 L 82 21 M 79 17 L 83 21 L 79 25" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
