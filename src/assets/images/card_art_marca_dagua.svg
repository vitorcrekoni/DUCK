<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Cyan / Indigo / Cyber Dark) -->
    <linearGradient id="mdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041829" />
      <stop offset="45%" stop-color="#061220" />
      <stop offset="100%" stop-color="#18041d" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="mdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Grid Pattern -->
    <pattern id="mdGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Card Background with Rounded Border -->
  <rect x="1.5" y="1.5" width="597" height="147" rx="18" fill="url(#mdBg)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.55" />
  
  <!-- Subtle Texture -->
  <rect x="2" y="2" width="596" height="146" rx="17" fill="url(#mdGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="80" cy="75" r="70" fill="#06b6d4" opacity="0.2" filter="url(#mdGlow)" />
  <circle cx="560" cy="20" r="45" fill="#f43f5e" opacity="0.12" filter="url(#mdGlow)" />

  <!-- HUD Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8" />
  <path d="M 588 24 L 588 12 L 576 12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8" />
  <path d="M 12 126 L 12 138 L 24 138" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8" />
  <path d="M 588 126 L 588 138 L 576 138" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8" />

  <!-- Icon Container -->
  <g transform="translate(24, 30)">
    <!-- Glow Box -->
    <rect x="0" y="0" width="88" height="88" rx="18" fill="#083344" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6" filter="url(#mdGlow)" />
    <!-- Neural Clean Wand Graphic -->
    <circle cx="44" cy="44" r="25" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" />
    <text x="44" y="55" font-size="34" text-anchor="middle">✨</text>
    <!-- Crosshair Target -->
    <circle cx="78" cy="10" r="4" fill="#06b6d4" />
    <circle cx="78" cy="10" r="2" fill="#ffffff" />
  </g>

  <!-- Content Group -->
  <g transform="translate(130, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="76" height="19" rx="5" fill="#083344" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" />
      <text x="38" y="13.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="1">IA NEURAL</text>

      <rect x="82" y="0" width="94" height="19" rx="5" fill="#4c0519" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5" />
      <text x="129" y="13.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#fecdd3" text-anchor="middle" letter-spacing="0.5">VÍDEOS &amp; FOTOS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="'Orbitron', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">
      REMOVEDOR DE <tspan fill="#22d3ee">MARCA D'ÁGUA</tspan>
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="103" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Apague logos e marcas com reconstituição inteligente mantendo resolução
    </text>

    <!-- Extra highlight tags -->
    <g transform="translate(0, 115)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06b6d4">
        ⚡ 100% LOCAL NO NAVEGADOR • MANTÉM FPS &amp; ÁUDIO ORIGINAL
      </text>
    </g>
  </g>

  <!-- Action Button (Right Side) -->
  <g transform="translate(480, 52)">
    <rect x="0" y="0" width="96" height="42" rx="11" fill="#0891b2" fill-opacity="0.5" stroke="#22d3ee" stroke-width="1.2" filter="url(#mdGlow)" />
    <text x="42" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ACESSAR</text>
    <!-- Arrow -->
    <path d="M 72 21 L 80 21 M 77 17 L 81 21 L 77 25" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
