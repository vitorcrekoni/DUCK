<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="promptsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052014" />
      <stop offset="45%" stop-color="#03150c" />
      <stop offset="100%" stop-color="#020a06" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="promptsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="promptsDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.9" fill="#10b981" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Card Background with Rounded Border -->
  <rect x="1.5" y="1.5" width="597" height="147" rx="18" fill="url(#promptsBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.55" />
  
  <!-- Subtle Dots Texture -->
  <rect x="2" y="2" width="596" height="146" rx="17" fill="url(#promptsDots)" />

  <!-- Ambient Light Orbs -->
  <circle cx="80" cy="75" r="70" fill="#10b981" opacity="0.2" filter="url(#promptsGlow)" />
  <circle cx="560" cy="20" r="45" fill="#34d399" opacity="0.12" filter="url(#promptsGlow)" />

  <!-- HUD Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8" />
  <path d="M 588 24 L 588 12 L 576 12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8" />
  <path d="M 12 126 L 12 138 L 24 138" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8" />
  <path d="M 588 126 L 588 138 L 576 138" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8" />

  <!-- Icon Container -->
  <g transform="translate(24, 30)">
    <!-- Glow Box -->
    <rect x="0" y="0" width="88" height="88" rx="18" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" filter="url(#promptsGlow)" />
    <!-- Camera/Lens Matrix Graphic -->
    <circle cx="44" cy="44" r="24" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
    <circle cx="44" cy="44" r="14" fill="#022c22" stroke="#34d399" stroke-width="1.5" />
    <!-- 4-point Sparkle Star -->
    <path d="M 44 26 Q 44 44 26 44 Q 44 44 44 62 Q 44 44 62 44 Q 44 44 44 26 Z" fill="#6ee7b7" filter="url(#promptsGlow)" />
    <!-- Small Sparks -->
    <circle cx="22" cy="22" r="2" fill="#a7f3d0" />
    <circle cx="66" cy="22" r="2.5" fill="#a7f3d0" />
    <circle cx="66" cy="66" r="2" fill="#a7f3d0" />
    <!-- Live Ping Dot -->
    <circle cx="78" cy="10" r="4" fill="#10b981" />
    <circle cx="78" cy="10" r="2" fill="#ffffff" />
  </g>

  <!-- Content Group -->
  <g transform="translate(130, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="70" height="19" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
      <text x="35" y="13.5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">GALERIA</text>

      <rect x="76" y="0" width="102" height="19" rx="5" fill="#042f2e" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.5" />
      <text x="127" y="13.5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="8.5" font-weight="700" fill="#99f6e4" text-anchor="middle" letter-spacing="0.5">FOTOS &amp; VÍDEOS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="'Orbitron', system-ui, sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="1.2">
      PROMPTS <tspan fill="#34d399">IA</tspan>
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="103" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11.5" font-weight="500" fill="#a7f3d0" letter-spacing="0.2">
      Galeria com fotos e vídeos reais, copie com 1 clique
    </text>

    <!-- Extra highlight tags -->
    <g transform="translate(0, 115)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#10b981">
        ✨ FOTORREALISMO • UGC TIKTOK • CENAS CINEMATOGRÁFICAS
      </text>
    </g>
  </g>

  <!-- Action Button (Right Side) -->
  <g transform="translate(480, 52)">
    <rect x="0" y="0" width="96" height="42" rx="11" fill="#065f46" fill-opacity="0.5" stroke="#34d399" stroke-width="1.2" filter="url(#promptsGlow)" />
    <text x="42" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ENTRAR</text>
    <!-- Arrow -->
    <path d="M 72 21 L 80 21 M 77 17 L 81 21 L 77 25" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
