<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Emerald to Cyan Obsidian) -->
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021f15" />
      <stop offset="50%" stop-color="#04181a" />
      <stop offset="100%" stop-color="#031622" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cpGlowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cpGlowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chrome Title Gradient -->
    <linearGradient id="cpTitleChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <pattern id="cpVaultGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Card Outer Frame -->
  <rect x="2" y="2" width="1196" height="176" rx="22" fill="url(#cpBg)" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />
  <rect x="3" y="3" width="1194" height="174" rx="21" fill="url(#cpVaultGrid)" />

  <!-- Dual Ambient Orbs -->
  <circle cx="120" cy="90" r="100" fill="#10b981" opacity="0.18" filter="url(#cpGlowEmerald)" />
  <circle cx="1080" cy="90" r="100" fill="#38bdf8" opacity="0.16" filter="url(#cpGlowEmerald)" />

  <!-- Sci-Fi HUD Corner Brackets -->
  <path d="M 16 34 L 16 16 L 34 16" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.9" />
  <path d="M 1184 34 L 1184 16 L 1166 16" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
  <path d="M 16 146 L 16 164 L 34 164" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.9" />
  <path d="M 1184 146 L 1184 164 L 1166 164" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />

  <!-- Center Hex/Tech Divider Line -->
  <line x1="160" y1="140" x2="960" y2="140" stroke="#059669" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Left Icon Crest: Crown Vault Visual -->
  <g transform="translate(36, 35)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="1.8" filter="url(#cpGlowEmerald)" />
    <!-- Crown / Diamond Key -->
    <text x="55" y="72" font-size="44" text-anchor="middle">👑</text>
    <circle cx="95" cy="16" r="5" fill="#34d399" filter="url(#cpGlowEmerald)" />
    <circle cx="95" cy="16" r="2.5" fill="#ffffff" />
    <text x="55" y="98" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">OFICIAL PRO</text>
  </g>

  <!-- Typography and Badges -->
  <g transform="translate(170, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="138" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="69" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">CATÁLOGO OFICIAL</text>

      <rect x="148" y="0" width="154" height="22" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1" />
      <text x="225" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="1">IA • DESIGN • VPN • APIS</text>

      <rect x="312" y="0" width="144" height="22" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1" />
      <text x="384" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">DISPONÍVEL EM ESTOQUE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="92" font-family="'Orbitron', system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#cpTitleChrome)" letter-spacing="2">
      CONTAS PRO &amp; APIS
    </text>

    <!-- Description -->
    <text x="0" y="122" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
      Contas Premium, APIs de IA (<tspan fill="#6ee7b7" font-weight="700">Claude, Grok, Kimi</tspan>), Ferramentas de Design (<tspan fill="#38bdf8" font-weight="700">Canva, CapCut</tspan>), Produtividade, Streaming e VPNs
    </text>
  </g>

  <!-- CTA Action Button (Right Side) -->
  <g transform="translate(1005, 62)">
    <rect x="0" y="0" width="160" height="56" rx="15" fill="#10b981" filter="url(#cpGlowEmerald)" />
    <text x="74" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1.5">VER CATÁLOGO</text>
    <path d="M 132 28 L 142 28 M 138 23 L 143 28 L 138 33" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
