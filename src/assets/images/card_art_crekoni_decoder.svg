<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dual Cyan to Amber) -->
    <linearGradient id="decBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041824" />
      <stop offset="50%" stop-color="#091322" />
      <stop offset="100%" stop-color="#241304" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="decGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="decGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chrome Title Gradient -->
    <linearGradient id="decTitleChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <pattern id="decTechGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Card Outer Frame -->
  <rect x="2" y="2" width="1196" height="176" rx="22" fill="url(#decBg)" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" />
  <rect x="3" y="3" width="1194" height="174" rx="21" fill="url(#decTechGrid)" />

  <!-- Dual Ambient Orbs -->
  <circle cx="120" cy="90" r="100" fill="#06b6d4" opacity="0.18" filter="url(#decGlowCyan)" />
  <circle cx="1080" cy="90" r="100" fill="#f59e0b" opacity="0.16" filter="url(#decGlowAmber)" />

  <!-- Sci-Fi HUD Corner Brackets -->
  <path d="M 16 34 L 16 16 L 34 16" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.9" />
  <path d="M 1184 34 L 1184 16 L 1166 16" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.9" />
  <path d="M 16 146 L 16 164 L 34 164" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.9" />
  <path d="M 1184 146 L 1184 164 L 1166 164" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.9" />

  <!-- Center Hex/Tech Divider Line -->
  <line x1="160" y1="140" x2="960" y2="140" stroke="#0891b2" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Left Icon Crest: Dual Engine Visual -->
  <g transform="translate(36, 35)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#0a192f" stroke="#06b6d4" stroke-width="1.8" filter="url(#decGlowCyan)" />
    <!-- Duck Silhouette + Picture Frame -->
    <text x="32" y="66" font-size="36" text-anchor="middle">🦆</text>
    <text x="76" y="68" font-size="34" text-anchor="middle">🖼️</text>
    <circle cx="95" cy="16" r="5" fill="#22d3ee" filter="url(#decGlowCyan)" />
    <circle cx="95" cy="16" r="2.5" fill="#ffffff" />
    <text x="55" y="98" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">DUAL ENGINE</text>
  </g>

  <!-- Typography and Badges -->
  <g transform="translate(170, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="154" height="22" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1" />
      <text x="77" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="1">⚡ SISTEMA UNIFICADO</text>

      <rect x="164" y="0" width="144" height="22" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1" />
      <text x="236" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">DUAL ENGINE ATIVO</text>

      <rect x="318" y="0" width="156" height="22" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="396" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="1">STEGANOGRAPHY 100%</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="92" font-family="'Orbitron', system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#decTitleChrome)" letter-spacing="2">
      CREKONI DECODER
    </text>

    <!-- Description -->
    <text x="0" y="122" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
      Os dois juntos: <tspan fill="#38bdf8" font-weight="700">Duck LSB</tspan> + <tspan fill="#fbbf24" font-weight="700">TT-IMG V1</tspan> para decodificar todo tipo de arquivo e Imagens Feitas Com IA
    </text>
  </g>

  <!-- CTA Action Button (Right Side) -->
  <g transform="translate(1005, 62)">
    <rect x="0" y="0" width="160" height="56" rx="15" fill="#f59e0b" filter="url(#decGlowAmber)" />
    <text x="74" y="34" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1.5">ENTRAR AGORA</text>
    <path d="M 132 28 L 142 28 M 138 23 L 143 28 L 138 33" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
