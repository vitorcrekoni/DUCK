<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180728" />
      <stop offset="45%" stop-color="#0e051a" />
      <stop offset="100%" stop-color="#080210" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="wfPurpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Circuit Pattern -->
    <pattern id="wfGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Card Background with Rounded Border -->
  <rect x="1.5" y="1.5" width="597" height="147" rx="18" fill="url(#wfBg)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.55" />
  
  <!-- Subtle Grid Texture -->
  <rect x="2" y="2" width="596" height="146" rx="17" fill="url(#wfGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="80" cy="75" r="70" fill="#a855f7" opacity="0.2" filter="url(#wfGlow)" />
  <circle cx="560" cy="20" r="45" fill="#c084fc" opacity="0.12" filter="url(#wfGlow)" />

  <!-- HUD Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8" />
  <path d="M 588 24 L 588 12 L 576 12" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8" />
  <path d="M 12 126 L 12 138 L 24 138" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8" />
  <path d="M 588 126 L 588 138 L 576 138" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8" />

  <!-- Icon Container -->
  <g transform="translate(24, 30)">
    <!-- Glow Box -->
    <rect x="0" y="0" width="88" height="88" rx="18" fill="#2e1065" fill-opacity="0.6" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" filter="url(#wfGlow)" />
    <!-- Node Circuit Connectors -->
    <circle cx="14" cy="14" r="2.5" fill="#e9d5ff" opacity="0.8" />
    <circle cx="74" cy="14" r="2.5" fill="#e9d5ff" opacity="0.8" />
    <circle cx="14" cy="74" r="2.5" fill="#e9d5ff" opacity="0.8" />
    <circle cx="74" cy="74" r="2.5" fill="#e9d5ff" opacity="0.8" />
    <line x1="14" y1="14" x2="44" y2="44" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
    <line x1="74" y1="14" x2="44" y2="44" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
    <!-- Lightning Bolt Icon -->
    <path d="M 48 16 L 28 50 L 44 50 L 38 74 L 62 38 L 46 38 Z" fill="#facc15" filter="url(#wfGlow)" />
    <!-- Ping Dot -->
    <circle cx="78" cy="10" r="4" fill="#a855f7" />
    <circle cx="78" cy="10" r="2" fill="#ffffff" />
  </g>

  <!-- Content Group -->
  <g transform="translate(130, 0)">
    <!-- Badges Row -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="62" height="19" rx="5" fill="#3b0764" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
      <text x="31" y="13.5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="800" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">FLUXOS</text>

      <rect x="68" y="0" width="94" height="19" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="115" y="13.5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="8.5" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="0.5">COMFYUI &amp; IA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="'Orbitron', system-ui, sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="1.2">
      WORKFLOWS <tspan fill="#c084fc">IA</tspan>
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="103" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Adquira os Melhores Workflows de Imagens e Vídeos
    </text>

    <!-- Extra highlight tags -->
    <g transform="translate(0, 115)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#a855f7">
        ⚡ +18 SEM CENSURA • FOTORREALISMO • UPSCALE 8K
      </text>
    </g>
  </g>

  <!-- Action Button (Right Side) -->
  <g transform="translate(480, 52)">
    <rect x="0" y="0" width="96" height="42" rx="11" fill="#581c87" fill-opacity="0.5" stroke="#c084fc" stroke-width="1.2" filter="url(#wfGlow)" />
    <text x="42" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ENTRAR</text>
    <!-- Arrow -->
    <path d="M 72 21 L 80 21 M 77 17 L 81 21 L 77 25" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
